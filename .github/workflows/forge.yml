name: Forge
on:
  workflow_call:
    secrets:
      token:
        description: 'app token or pat'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Hash of EVERY playwright-core manifest in the tree (root + nested
          # copies): key changes iff any copy's required revisions change.
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/**/playwright-core/browsers.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # A tree can hold multiple playwright copies (e.g. @playwright/test pins
      # its own nested one while another dep hoists a newer root). Bin links
      # and ESM resolution may each land on a different copy, so install
      # browsers for every copy. Idempotent: downloads only what's missing.
      - name: Setup Playwright
        if: hashFiles('node_modules/**/playwright-core/browsers.json') != ''
        run: |
          find node_modules -path '*playwright-core/cli.js' | while read -r cli; do
            echo "Installing browsers for $cli"
            node "$cli" install --with-deps
          done

      - name: Test
        run: npm test --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Semantic release
        run: npx semantic-release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          HUSKY: 0
