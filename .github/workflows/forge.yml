name: Forge
on:
  workflow_call:
    secrets:
      token:
        description: 'app token or pat'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install
        run: npm ci
        
      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint code
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
          restore-keys: ${{ runner.os }}-playwright-

      # Idempotent: downloads only browsers missing from the (possibly stale)
      # cache, so a version-keyed cache can never drift from the driver that
      # import('playwright') resolves at test time.
      - name: Setup Playwright
        run: npx playwright install --with-deps

      - name: Test
        run: npm test --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Semantic release
        run: npx semantic-release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          HUSKY: 0
